name: nexora
description: "NEXORA - offline-first mesh messenger"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management + DI + routing — ADR-0002 (GetX + MVC + Clean Architecture)
  get: ^4.6.6

  # Local persistence — ADR-0001 (Drift / SQLite)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Auth — Google Authentication via Firebase Auth (FR-AUTH-001), fixed by
  # the BRD/ADR-0005 — not a new foundational choice (E01-T01).
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2

  # Account↔device metadata mapping in the same Firebase project
  # (FR-FB-001/002, ADR-0005) — not a new foundational choice (E01-T02).
  # Realtime Database, not Firestore: Firestore requires the Blaze billing
  # plan to provision at all; the human declined enabling billing. See
  # docs/conventions.md "Third-party dependency additions".
  firebase_database: ^11.1.4

  # Project UI widget kit — human-approved (new_dependency gate, 2026-08-26).
  # Standard component layer for popups/dialogs, async-aware buttons, and
  # text inputs, superseding raw Material equivalents for those three roles.
  # See docs/conventions.md "UI widget kit".
  on_popup_window_widget: ^0.0.14
  on_process_button_widget: ^2.0.13
  on_text_input_widget: ^0.1.0

  # Signal protocol implementation — ADR-0003, OQ-E03-1 (resolved 2026-08-27,
  # human-approved). Pure Dart, no native/FFI build step. GPL-3.0 licensed
  # dependency, accepted by the human as compatible with NEXORA's
  # distribution model (see epic.md OQ-E03-1).
  libsignal_protocol_dart: ^0.8.2

  # Device location acquisition — E09-T05, OQ-E09-T05-1 (resolved
  # 2026-09-04, human-approved). Android only for this task; the
  # ecosystem's de-facto Flutter location package, whose
  # permission/timeout/last-known shape already matches this task's
  # contract (task file §5). Pinned to an exact version, not a caret range,
  # per the answered question.
  geolocator: 14.0.2

  # Installed build-number reader — E14-T04, Q-E14-T04-1 (resolved
  # 2026-09-05, human-approved). Needed for `EvaluateVersionStateUseCase`'s
  # (E14-T02) injected `InstalledBuildProvider` to read a REAL build number
  # at launch. Already present as a *transitive* dependency at 10.2.1
  # (pulled in by another package, per `pubspec.lock` before this change) —
  # pinned to that exact, already-resolved version rather than a caret
  # range, per the geolocator precedent above and the answered question.
  package_info_plus: 10.2.1

  # Google Play in-app update binding — E14-T04, Q-E14-T04-1 (resolved
  # 2026-09-05, human-approved). The commonly-used Flutter package for the
  # Google Play "Immediate Update" API (FR-VER-007) — Android only, no iOS
  # equivalent (task file §6 Risks). Pinned to an exact version, not a
  # caret range, per the geolocator precedent above.
  in_app_update: 5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test-only: builds a hand-crafted v1 schema in database_migration_test.dart
  # (already a transitive dep via drift/sqlite3_flutter_libs — declared
  # directly per analyzer's depend_on_referenced_packages).
  sqlite3: ^3.5.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Drift codegen — ADR-0001
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

  # Pigeon codegen for the Dart<->Kotlin transport boundary — ADR-0004
  # (already named as the accepted choice, not a new foundational pick).
  pigeon: ^28.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
