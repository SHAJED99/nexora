org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Local build-environment workaround: the pub cache lives on C: while this
# project lives on E:, and Kotlin's incremental compiler cache tries to
# compute a relative path between the two, which has no common root on
# Windows and throws (java.lang.IllegalArgumentException: "this and base
# files have different roots"). Disabling incremental Kotlin compilation
# avoids it; full recompiles are slower but always correct. Not a project
# code issue -- a local toolchain quirk.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
