# design/sources.yaml — where designs come from, and which route each screen binds to.
#
# Ships EMPTY. Genesis T03 fills it once you drop a design into docs/UI/.
# The self-test does not use this file — it generates its own and writes to a
# scratch golden root, so `make design-selftest` never touches your design law.
version: 1

# Where extracted goldens land. Committed — a diff on the golden IS the design
# changelog. Only override for scratch runs.
golden_root: design/golden

sources:
  # kind: static  — a folder of .html (a Figma HTML export, a bundled sample, a mockup)
  # kind: command — a React/Vue/Svelte design app the tool boots and kills for you
  # kind: url     — already running somewhere
  # kind: figma   — Figma frames; imported via design/tools/figma-import.mjs (not browsable)
  #
  # ui:
  #   kind: static
  #   root: docs/UI/sample-frontend
  #
  # ui_app:
  #   kind: command
  #   cmd: "npm --prefix docs/UI/design-app run dev"
  #   ready_url: http://localhost:5173
  #   timeout_s: 120
  #
  # ui_figma:
  #   kind: figma
  #   file_key: "abc123XYZ"          # from the Figma URL
  #   node_ids: ["12:345", "12:678"] # frame ids, one per screen
  #   # then: node design/tools/figma-import.mjs --screen <id>
  #   # Prefer an HTML export + kind: static — a real browser's computed styles
  #   # beat roles inferred from Figma layer names. The export is never shipped.

  ui:
    kind: static
    root: docs/UI/stitch_nexora_mesh_messenger
    # Google Stitch export (Q-DESIGN-001, spec/questions.md). Each screen is
    # its own self-contained code.html (Tailwind CDN + real computed styles),
    # not a single-file bundle — no state-setup clicks needed to reach them.
    # Design tokens: docs/UI/stitch_nexora_mesh_messenger/nexora_design_system/DESIGN.md

# Where the BUILT app runs when the gate executes.
# Override per run: make design-verify IMPL=http://localhost:3000
impl:
  kind: url
  url: http://localhost:3000
  # kind: command
  # cmd: "npm run dev --workspace apps/web"
  # ready_url: http://localhost:3000
  # timeout_s: 120

# The Flutter-capable path (E06-T01, closes OQ-E00-3): `make design-verify
# IMPL=flutter` (or `--impl-probe <path>` for a one-off file) skips the
# browser/DOM capture above entirely and reads a pre-built probe JSON per
# screen instead — see design/tools/lib/flutter_probe.mjs and
# docs/design-gate-flutter.md. Dumps land here via `make design-probe`
# (test/design/design_probe_test.dart).
impl_flutter:
  kind: flutter-probe
  dir: build/design-probe

screens:
  # Six unique screens from the Stitch export. A seventh export folder,
  # nexora_secure_network_dashboard/, is a byte-identical duplicate of
  # welcome_to_nexora/ (same generation, different folder name) — intentionally
  # not bound to a screen id here; see design/gaps.md.
  #
  # Android phone only for now, pending Q-SCOPE-002 (platform scope). Add
  # 768x1024 tablet captures once that's answered and Design.md's tablet
  # layout (§108) gets its own Stitch pass.
  - id: welcome
    source: ui
    design_path: /welcome_to_nexora/code.html
    impl_path: /welcome
    viewports: [390x844]
    states: [{ name: default }]

  - id: dashboard
    source: ui
    design_path: /dashboard/code.html
    impl_path: /dashboard
    viewports: [390x844]
    states: [{ name: default }]

  - id: conversations
    source: ui
    design_path: /conversations/code.html
    impl_path: /conversations
    viewports: [390x844]
    states: [{ name: default }]

  - id: chat
    source: ui
    design_path: /chat_with_alex/code.html
    impl_path: /chat/[id]
    viewports: [390x844]
    states: [{ name: default }]
    ignore_text:
      - '^\d{1,2}:\d{2}\s?(AM|PM)?$'   # timestamps

  - id: devices
    source: ui
    design_path: /devices/code.html
    impl_path: /devices
    viewports: [390x844]
    states: [{ name: default }]

  - id: settings
    source: ui
    design_path: /settings/code.html
    impl_path: /settings
    viewports: [390x844]
    states: [{ name: default }]

  - id: login
    source: ui
    design_path: /login/code.html
    impl_path: /login
    viewports: [390x844]
    states: [{ name: default }]
    # "Signing in to NEXORA" — the transient state after tapping "Continue
    # with Google" on the welcome screen, while OAuth completes. Answers the
    # missing-login-screen gap the human raised; Google Sign-In is NEXORA's
    # sole auth method (BRD §5), so there is no separate credentials form.

  # E12-B06: the two `source: derived` screens GAP-028 approved
  # (design/gaps.md), now registered so `make design-verify SCREEN=<id>`
  # gates them like every `source: ui` screen above, per `design-fidelity`
  # §3's own instruction ("derived screens get a contract too ... once
  # built, extract the built screen as its own golden"). Both contracts
  # have no design SOURCE to extract from (`golden: none yet` in their own
  # frontmatter) — the golden under `design/golden/<id>/default@390x844/`
  # was extracted from the FIRST successful `make design-probe` dump of the
  # already-built screen instead, per that same instruction. `design_path`
  # is `n/a` for both: verify.mjs never reads it on the
  # `impl_flutter`/`--impl flutter` path this repo actually uses for every
  # Flutter screen (`design/tools/verify.mjs`, the `useFlutterProbe` branch)
  # — it is documentation only, same as `device-enrollment-approval.md`'s
  # own `impl_path: n/a` frontmatter line.
  - id: device-enrollment
    source: derived
    design_path: n/a — derived, design/screens/device-enrollment.md (GAP-028)
    impl_path: /device-enrollment
    viewports: [390x844]
    states: [{ name: default }]
    # Captures the `waiting` state (the route's own first frame) — the
    # contract's other two states (`denied`, `no-recovery-notice`) are not
    # separately registered here: `verify.mjs`'s Flutter-probe path resolves
    # one dump file per SCREEN id, not per state (`build/design-probe/
    # <screen>.json`, no per-state filename), so one state per screen id is
    # what this gate mechanism can register today — a follow-up concern for
    # whichever task widens per-state Flutter probing, not this bug.

  - id: device-enrollment-approval
    source: derived
    design_path: n/a — derived, design/screens/device-enrollment-approval.md (GAP-028)
    impl_path: n/a — a row appended to /devices, not its own route (see the
      contract's own frontmatter)
    viewports: [390x844]
    states: [{ name: default }]
    # Captures `/devices` with an empty relationship list and exactly one
    # pending enrollment request seeded — isolates the dump to this
    # contract's own elements (DEA1-DEA9), same isolation principle already
    # used for the `_fixture_*` probes below.

