<!doctype html>
<html lang="en">
<head>
<!--
  SYNTHETIC TEST DATA — not project design, never shipped.
  A FAITHFUL port of reference.html: deliberately different tags, class names and
  nesting — the gate must measure the design, not the markup. Same roles, same
  copy, same computed styles. The gate must report PASS at 100% on this file.
  See selftest-data/README.md.
-->
<meta charset="utf-8">
<title>Sign in</title>
<style>
  :root {
    --accent: #059669; --accent-strong: #047857;
    --border: #e4e4e7; --ink: #18181b; --ink-2: #3f3f46;
    --muted: #52525b; --muted-2: #71717a; --faint: #a1a1aa;
    --radius-control: 7px; --radius-surface: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif; font-size: 13px; color: var(--ink);
    background: #fafafa; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .auth-panel {
    width: 360px; background: #ffffff; border: 1px solid var(--border);
    border-radius: var(--radius-surface); padding: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .auth-title { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .auth-lead { font-size: 12px; font-weight: 400; color: var(--muted-2); margin-bottom: 20px; }
  .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
  .field {
    width: 100%; height: 32px; background: #ffffff; color: var(--ink);
    border: 1px solid var(--border); border-radius: var(--radius-control); padding: 0 10px;
    font-size: 14px; font-weight: 400; font-family: system-ui, sans-serif; margin-bottom: 14px;
  }
  .field-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .checkbox-inline { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .link-inline { font-size: 12px; font-weight: 500; color: var(--accent); text-decoration: none; }
  .btn-primary {
    width: 100%; height: 32px; background: var(--accent); color: #ffffff;
    border: 1px solid var(--accent-strong); border-radius: var(--radius-control);
    font-size: 13px; font-weight: 600; font-family: system-ui, sans-serif;
  }
  .auth-legal { margin-top: 16px; font-size: 11px; font-weight: 400; color: var(--faint); text-align: center; }
</style>
</head>
<body>
  <section class="auth-panel">
    <header class="auth-header">
      <h1 class="auth-title">Sign in</h1>
      <div class="auth-lead">Welcome back. Use your work account.</div>
    </header>
    <form class="auth-form" novalidate>
      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <input class="field" id="email" name="email" type="email" placeholder="you@company.com" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <input class="field" id="password" name="password" type="password" placeholder="••••••••" required>
      </div>
      <div class="field-row">
        <span class="checkbox-inline"><input id="remember" name="remember" type="checkbox">Remember me</span>
        <a class="link-inline" href="/reset">Forgot password?</a>
      </div>
      <button class="btn-primary" type="submit">Sign in</button>
    </form>
    <div class="auth-legal">Protected by SSO. Contact support for access.</div>
  </section>
</body>
</html>
