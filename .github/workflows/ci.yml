name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  flutter:
    name: analyze, test, build (Android debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --debug
        run: flutter build apk --debug

  harness:
    name: harness checks (DAG, lessons, H8 self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # scheduler.py and health.py defer `import yaml` inside a try/except
      # that exits with "pip install pyyaml", so they are NOT stdlib-only --
      # a first version of this job asserted they were, having read only the
      # top-level import lines, and went red on the runner at once.
      # requirements.txt already pins pyyaml, so this installs an
      # already-accepted dependency and is not a rule-3 new_dependency call.
      - name: pip install -r requirements.txt
        run: pip install -r requirements.txt

      # Each step below guards a harness file that has silently broken before,
      # and each break was found by a human running the command by hand rather
      # than by CI. `make lessons` crashed on EVERY invocation for weeks,
      # because `lessons.py` called int() on a `recurrence:` written `**2**`;
      # H8 shipped three separate unsafe-direction regressions in one day.
      #
      # All four exit 0 on `development` today, so they gate honestly from the
      # moment they land.
      #
      # What these do NOT cover: H1-H7. `--selftest` short-circuits before the
      # CHECKS list, so it exercises H8's classifier against fixtures and
      # nothing else. H4's false negative (#312) would still not be caught
      # here -- that needs `make health`, which is excluded below.
      - name: make validate  # epic/task DAG, traces_to, statuses
        run: make validate

      - name: make lessons  # the lesson ledger parses and totals
        run: make lessons

      - name: make health-selftest  # H8 still rejects every shape it wrongly exempted
        run: make health-selftest

      # Without CHECK=1 this asserts nothing about orphan counts -- it just
      # proves traceability.py still parses the tree and produces its matrix.
      # The tool was otherwise gated by nothing at all.
      - name: make trace  # the traceability generator still runs
        run: make trace

      # NOT wired, deliberately, because both exit non-zero on `development`
      # today and a red-from-birth job is a job everyone learns to ignore:
      #
      #   make health         H5/H6/H7 fail -- a same-model review, an
      #                       unpromoted recurring lesson, a skipped merge
      #                       gate. All three are human-gated, not defects.
      #   make trace CHECK=1  14 blocking orphans, every one decision- or
      #                       freeze-bound. See CHANGELOG.md, Known gaps.
      #   make design-verify  4 of 17 screens FAIL today -- chat 86%, devices
      #                       82%, conversations 38.6%, dashboard 34.9%. A
      #                       2026-09-24 review re-derived the deltas from the
      #                       raw probe JSON and found NO missing section or
      #                       heading: they are GAP-012's approved card-wide
      #                       tap target merging a card into one accessibility
      #                       node, a probe classification artifact for the nav
      #                       labels, and mock-vs-real data. Wiring it now
      #                       would ship exactly the red-from-birth job this
      #                       comment block exists to refuse. It becomes
      #                       wireable after P9 triages those deltas and writes
      #                       the gap entries that do not yet exist -- see
      #                       docs/product-completeness-audit.md.
      #
      #                       Note the gate ALSO needs `npm install`, which no
      #                       CI job here runs. `make design-deps` now fails
      #                       loudly rather than letting an unrunnable gate
      #                       look identical to a gate nobody ran -- which is
      #                       the state it was actually in until 2026-09-24.
      #
      # `docs/ARCHITECTURE.md` already names `make health STRICT=1` as the
      # intended end state. It becomes wireable when those gates clear -- not
      # by loosening the checks to make a green badge.
