name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    name: analyze, test, build (Android debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --debug
        run: flutter build apk --debug
