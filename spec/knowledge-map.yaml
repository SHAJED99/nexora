journeys:
  - id: J-001
    summary: "Primary onboarding flow: Google Login → Account Created → Device Setup → Discover Devices → Connection Request → (Trusted: Auto-Accept | Unknown: Authentication) → Connection → Secure Channel → {Chat, PTT, Call} → Dynamic Routing → {Bluetooth, Wi-Fi, Internet} → Relay → Destination"
    path: documentation/BRD.md
  - id: J-002
    summary: "First-run detailed flow: First Launch → Welcome → Permission Flow → Device Setup → Device Pairing → Trust Establishment → First Dashboard"
    path: documentation/Design.md

business_rules:
  - id: BR-001
    summary: "Battery consumption alone must never determine the best route"
    path: documentation/BRD.md
  - id: BR-002
    summary: "A new connection must be established and validated before the old one is terminated (make-before-break migration)"
    path: documentation/BRD.md
  - id: BR-003
    summary: "Relay devices may never decrypt end-to-end encrypted communication"
    path: documentation/BRD.md
  - id: BR-004
    summary: "Conflict resolution always favors the more security-restrictive state (BLOCK>TRUST, LOCATION-OFF>LOCATION-ON, REVOKED>ACTIVE, REMOVED>MEMBER)"
    path: documentation/BRD.md
  - id: BR-005
    summary: "Blocking is bidirectional-independent — both sides must authorize a connection, one side blocking is sufficient to prevent it"
    path: documentation/BRD.md
  - id: BR-006
    summary: "Full table is 40 rules — see documentation/BRD.md §64 'Major Business Rules' for the complete list. Only the most architecturally load-bearing (BR-001..005) are indexed here; the table itself is the source of truth."
    path: documentation/BRD.md

data_models:
  - id: D-001
    summary: "Firebase data boundary — May store: auth, user/device identity+metadata, trust/block metadata, user config, revocation, push info, version policy. Must NOT store: message plaintext, voice/call recordings, private/session keys, permanent location history"
    path: documentation/BRD.md
  - id: D-002
    summary: "Message delivery state — Queued / Sent / Accepted / Delivered / Stored / Read / Failed"
    path: documentation/BRD.md
  - id: D-003
    summary: "Relay packet metadata — Packet ID, destination, priority, size, creation time, expiration time, delivery state"
    path: documentation/BRD.md
  - id: D-004
    summary: "Version categories — Application Version, Build Number, Protocol Version, Cryptographic Version, Database Schema Version — tracked independently"
    path: documentation/BRD.md

apis: []
  # None specified anywhere in BRD/Design — explicitly deferred (BRD §66.2, §68).

integrations:
  - id: I-001
    summary: "Google Authentication — sole authentication method (confirmed via design review — welcome screen shows only \"Continue with Google\")"
    path: documentation/BRD.md
  - id: I-002
    summary: "Firebase — auth, device/relationship metadata, remote-config-shaped version policy — bounded by the Firebase data boundary (D-001)"
    path: documentation/BRD.md
  - id: I-003
    summary: "Google Play in-app update — mandatory update delivery mechanism; app must never silently install arbitrary APKs"
    path: documentation/BRD.md

architecture:
  summary: >
    High-level layered intent from BRD §65: Google Auth → Firebase → Identity
    & Authorization → Communication App (Chat/PTT/Calls/Groups/Attachments/
    Location) → E2E Encryption → Sync Engine → Route Engine → Relay Engine →
    {Bluetooth, Wi-Fi, Internet} → Peer Devices. A Flutter+Android-native
    split is suggested (not contractual) in Design.md §92-96.
  decisions: []  # ADR pointers — populated at genesis
  source: documentation/BRD.md §65; documentation/Design.md §92-96

risks:
  - id: R-001
    summary: Design.md has no visual source, only text — resolved (see A record in spec/questions.md Q-DESIGN-001; Google Stitch used as the source)
    severity: high
    mitigation: "Mitigated — Google Stitch used as the design source, see Q-DESIGN-001"
    path: docs/intake-report.md
  - id: R-002
    summary: Mesh networking + E2E crypto + multi-transport routing is a large, security-critical surface for a first release; BRD itself defers 30 technical-design topics (§68) — Epic 00 will likely be unusually large
    severity: medium
    mitigation: Consider a phased wave rollout (e.g. direct-connection chat before multi-hop relay) rather than building the full mesh in wave 1 — a call for skills/epic-breakdown
    path: docs/intake-report.md
  - id: R-003
    summary: No numeric NFR targets anywhere (battery %, latency ms, storage MB) — every NFR in BRD §62 is qualitative; acceptance criteria at task-sharding time will need human-supplied numbers or they'll be invented (violates rule 1)
    severity: medium
    path: docs/intake-report.md

constraints:
  - id: C-001
    summary: Android-only for v1 (confirmed, spec/questions.md Q-SCOPE-002)
    path: documentation/BRD.md
  - id: C-002
    summary: Flutter application framework, Android-native components for system-sensitive functionality
    path: documentation/BRD.md
  - id: C-003
    summary: Offline-first is architecturally non-negotiable
    path: documentation/BRD.md
  - id: C-004
    summary: Google Authentication is the sole auth method — no other login path
    path: documentation/BRD.md
  - id: C-005
    summary: BRD excludes exact package/library/protocol/algorithm choices from its own scope — those are genesis's ADRs, not pre-decided
    path: documentation/BRD.md

